name: CI Pipeline
on:
  push:
    branches: ['master']

# Environment variables for the entire workflow
env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io # GitHub Container Registry (or use docker.io, ECR, etc.)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
  name: Lint & Test
  runs-on: ubuntu-latest

  steps:
    # Step 1: Checkout the code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history for better SonarQube analysis

    # Step 2: Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm' # Speeds up installs

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci # 'ci' is faster and stricter than 'install'

    # Step 4: Run Linting
    - name: Run ESLint
      run: npm run lint --

    # - name: Install Playwright Browsers
    #   run: npx playwright install --with-deps

    # - name: Start application
    #   run: |
    #     yarn build  # If you need to build first
    #     yarn start &

    # - name: Test
    #   run: npx playwright test

build-and-push:
  name: Build & Push Docker Image
  runs-on: ubuntu-latest
  needs: lint-and-test # Only runs if lint-and-test passes

  # Only run on specific branches to save resources
  if: |
    github.event_name == 'push' && 
    github.ref == 'refs/heads/master'

  steps:
    # Step 1: Set up Docker Buildx (for better caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 2: Build Docker image
    - name: Build and export Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: myapp:${{ github.sha }}
        outputs: type=docker,dest=/tmp/myapp.tar # This creates the .tar file
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: myapp-${{ github.sha }}
        path: /tmp/myapp.tar
        retention-days: 1 # Keeps the artifact for only 1 day

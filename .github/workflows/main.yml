name: CI
on:
  push:
    branches: ['master']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Start application
        run: |
          yarn build  # If you need to build first
          yarn start &

      - name: Test
        run: npx playwright test

      - name: Build
        run: yarn build
